name: Docs Website

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/docs.yaml
      - docs/**
      - "!**/README.md"
      - "!**/Justfile"
  push:
    branches:
      - main
    paths:
      - .github/workflows/docs.yaml
      - docs/**
      - "!**/README.md"
      - "!**/Justfile"
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev or prod)"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (dev or prod)"
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read

concurrency:
  group: docs-deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: blacksmith-16vcpu-ubuntu-2404
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          working_directory: ./docs

      - uses: ./.github/actions/setup-caches
      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: docs/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('docs/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: docusaurus build
        working-directory: ./docs
        env:
          DOCS_URL: ${{ vars.DOCS_URL }}
          GTAG_ID: ${{ vars.GTAG_ID }}
        run: just build /tmp/build

      # Run typechecking after building, so that it also checks the generated mdx files.
      - name: Typecheck doc snippets
        run: cargo test --test snippets -- docs_website

      # By default we ship a strict robots.txt (Disallow: /) so the public
      # dev/qa sites don't get indexed. In prod we swap in a permissive
      # robots.txt that allows crawling and points crawlers at the sitemap.
      - if: inputs.environment == 'prod'
        run: cp docs/prod-robots.txt /tmp/build/robots.txt

      # Hand the built site to the deploy job.
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: docs-build
          path: /tmp/build
          include-hidden-files: true
          retention-days: 1

  deploy:
    name: Deploy
    needs: build
    # Skip on fork PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      id-token: write # Required for AWS OIDC authentication
    runs-on: blacksmith-16vcpu-ubuntu-2404
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: docs-build
          path: /tmp/build

      # Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          role-session-name: DeployDocsWebsite
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: false

      - name: aws s3 sync
        run: aws s3 sync /tmp/build s3://${DOCS_S3_BUCKET} --delete
        env:
          DOCS_S3_BUCKET: ${{ vars.DOCS_S3_BUCKET }}
      - name: invalidate cloudfront
        run: aws cloudfront create-invalidation --distribution-id "${DOCS_CLOUDFRONT_DISTRIBUTION_ID}" --paths "/*" --output text --query "Invalidation.Id"
        env:
          DOCS_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.DOCS_CLOUDFRONT_DISTRIBUTION_ID }}
