[package]
name = "bauplan-api-macros"
description = "Derive macros for the public Bauplan API"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
proc-macro2-diagnostics = "0.10"
quote = "1"
syn = "2"

[dev-dependencies]
anyhow.workspace = true
displaydoc = "0.2"
gropius = { git = "https://github.com/BauplanLabs/gropius" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trybuild = "1"
