[tool.uv.workspace]
members = ["bauplan-sdk-types"]

[tool.uv.sources]
gitlint-core = { git = "https://github.com/colinmarc/gitlint", branch = "conventional-options", subdirectory = "gitlint-core" }
bauplan-sdk-types = { workspace = true }

[build-system]
requires = ["maturin>=1.11,<2.0"]
build-backend = "maturin"

[project]
name = "bauplan"
requires-python = ">=3.11"
dynamic = ["version"]
readme = "README.md"
description = "The client SDK and CLI for Bauplan"
authors = [{ name = "Bauplan Inc." }]
license = "Apache-2.0 OR MIT"
keywords = [
    "bauplan",
    "data-pipelines",
    "iceberg",
    "lakehouse",
    "data-versioning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "bauplan-sdk-types~=0.2.0",
]

[project.urls]
Documentation = "https://docs.bauplanlabs.com/"
Homepage = "https://www.bauplanlabs.com/"
Issues = "https://github.com/BauplanLabs/bauplan/issues"
Repository = "https://github.com/BauplanLabs/bauplan/"
Changelog = "https://github.com/BauplanLabs/bauplan/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "griffe~=2.2.0",
    "pyarrow~=25.0.1",
    "pyarrow-stubs~=20.0.0.20260819",
    "pytest~=9.1.1",
    "gitlint-core",
    "ruff~=0.16.5",
    "ty~=0.0.77",
    "apache-airflow~=3.3.1",
    "dagster~=1.13.20",
    "dbos~=2.31.0",
    "duckdb~=2.0.0",
    "google-cloud-bigquery~=3.44.0",
    "ipywidgets~=8.1.9",
    "marimo~=0.24.0",
    "matplotlib~=3.11.1",
    "openai~=3.6.0",
    "pandas~=3.0.6",
    "pandas-stubs~=3.0.5.260730",
    "pendulum~=3.2.0",
    "plotly~=7.0.0",
    "polars~=2.0.0",
    "prefect~=3.7.7",
    "pyiceberg~=0.12.0",
    "streamlit~=1.66.1",
    "temporalio~=1.32.0",
]

[tool.maturin]
python-source = "python"
module-name = "bauplan._internal"
bindings = "pyo3"
features = ["pyo3/extension-module", "python"]
data = "python/data"
strip = true
use-base-python = true
include = [
    # https://github.com/rust-lang/cargo/issues/5933
    { path = "LICENSE-APACHE", format = "sdist" },
    { path = "LICENSE-MIT", format = "sdist" },
    { path = "python/data/**/*", format = "sdist" },
]

[tool.ruff]
exclude = [
    "docs/gen_sdk_reference.py",
    "examples",
]

[tool.ruff.lint]
select = [
    "ANN001", # Missing type annotation for function argument
]

[tool.ty.src]
exclude = [
    "docs/gen_sdk_reference.py",
    "examples"
]

# Whitelist imports of bauplan._internal in __init__.py. The rust extension
# module gets built there.
[tool.ty.analysis]
allowed-unresolved-imports = ["bauplan._internal", "bauplan._internal.*"]

# Recompile whenever a rust file changes.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
]
